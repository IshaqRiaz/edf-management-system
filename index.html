<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDF Management System</title>
    <meta name="description" content="Employee Demand Form (EDF) Management System for Office Coordinators and Administrators with live countdown timers, Excel import, and real-time tracking." />
    <meta property="og:title" content="EDF Management System" />
    <meta property="og:description" content="Employee Demand Form (EDF) Management System for Office Coordinators and Administrators with live countdown timers, Excel import, and real-time tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        var originalConsoleError = console.error;
        console.error = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('Expected static flag was missing') !== -1) {
            return;
          }
          originalConsoleError.apply(console, arguments);
        };

        // Initialize persisted theme immediately to prevent flashing
        try {
          var storedTheme = localStorage.getItem('edf_theme');
          var isDark = storedTheme === 'dark' || (!storedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
